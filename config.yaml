site:
  name: "OpenPillar"
  tagline: "Open technology governance controls for financial services"
  description: "OpenPillar provides open, versioned cloud technology governance controls aligned to FCA, ISO 27001, and NIST frameworks — designed for banks and financial institutions."
  base_url: "https://openpillar.io"
  logo_text: "OpenPillar"

repos:
  policy_repo: "https://github.com/amplutude/openpillar-policies"
  app_repo: "https://github.com/amplutude/openpillar"

standards:
  - name: "FCA"
    description: "Financial Conduct Authority"
    url: "https://www.fca.org.uk/firms/operational-resilience"
  - name: "ISO 27001"
    description: "Information Security Management"
    url: "https://www.iso.org/isoiec-27001-information-security.html"
  - name: "NIST SP 800-53"
    description: "Security and Privacy Controls"
    url: "https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final"
  - name: "CIS Controls v8"
    description: "Center for Internet Security"
    url: "https://www.cisecurity.org/controls/v8"

footer:
  links:
    - label: "Policy Repository"
      url: "{{ repos.policy_repo }}"
    - label: "GitHub"
      url: "{{ repos.app_repo }}"
    - label: "FCA Guidelines"
      url: "https://www.fca.org.uk"
  copyright: "OpenPillar contributors. Content licensed under CC BY 4.0."
